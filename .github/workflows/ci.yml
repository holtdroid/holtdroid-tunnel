name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "ndk;$(sed -n 's/^ndkVersion=//p' gradle.properties)"
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: engine
        run: |
          test -z "$(gofmt -l .)"
          go vet -tags with_gvisor ./...
          GOOS=android GOARCH=arm64 go vet -tags with_gvisor ./...
          go test -tags with_gvisor ./...
      - run: ./gradlew --console=plain testDebugUnitTest lintDebug assembleRelease
